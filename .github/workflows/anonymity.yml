name: Anonymity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Commit identities use allowlisted emails
        # See AGENTS.md rule 0. Private-term scanning runs locally only (the term list is never committed).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="${{ github.sha }}"
          fi
          bash scripts/agents/identity-check.sh range "$RANGE"
