# Weekly dependency updates.
# Reason: CI fails on any high-severity `npm audit` advisory, and advisories
# accumulate without code changes. See docs/DEPLOYMENT.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Major upgrades of these packages are planned migrations, not automatic updates
    # (TypeScript 7 breaks @astrojs/check; Tailwind 4 is a rewrite). Do them as agent tasks.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
    groups:
      # One pull request for all minor and patch updates.
      # Major updates arrive as separate pull requests.
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
